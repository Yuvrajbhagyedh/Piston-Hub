<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Piston Hub</title>
  <link rel="icon" href="images/piston hub white.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; }
    nav {
      background: #000; padding: 24px 30px; display: flex; align-items: center;
      font-style: italic; border-bottom: 1px solid #222;
    }
    .logo img { height: 40px; width: 60px; }
    nav ul { list-style: none; margin-left: auto; }
    nav ul li { display: inline; margin-right: 20px; }
    nav ul li a { color: #fff; text-decoration: none; }
    .page { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 24px; font-weight: 600; }
    .cart-row {
      display: grid;
      grid-template-columns: 80px 1fr auto auto auto;
      gap: 18px; align-items: center;
      border: 1px solid #222; border-radius: 8px;
      padding: 14px; margin-bottom: 14px; background: #0d0d0d;
    }
    .cart-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background:#222; }
    .cart-info h3 { font-size: 17px; margin-bottom: 4px; }
    .cart-info p { color: #aaa; font-size: 14px; }
    .cart-qty { display: flex; align-items: center; gap: 10px; }
    .cart-qty button {
      width: 30px; height: 30px; border: none; border-radius: 4px;
      background: #ff9900; color: #000; font-size: 18px; cursor: pointer;
    }
    .cart-line { font-weight: bold; min-width: 80px; text-align: right; }
    .cart-remove {
      background: transparent; border: 1px solid #b12704; color: #ff6b53;
      padding: 6px 12px; border-radius: 5px; cursor: pointer;
    }
    .cart-remove:hover { background: #b12704; color: #fff; }
    #cart-empty { text-align: center; padding: 60px 0; color: #aaa; }
    #cart-empty a { color: #ff9900; }
    #cart-summary {
      margin-top: 24px; padding: 20px; border: 1px solid #222;
      border-radius: 8px; background: #0d0d0d; text-align: right;
    }
    #cart-summary .total { font-size: 22px; margin-bottom: 16px; }
    #cart-total { color: #ff9900; font-weight: bold; }
    .checkout-btn {
      background: #ff9900; color: #000; border: none; padding: 14px 28px;
      font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    .checkout-btn:hover { background: #ffae33; }
  </style>
</head>
<body>
  <nav>
    <div class="logo"><a href="index.html"><img src="images/piston hub white.png" alt="Piston Hub" /></a></div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="slider.html">Shop</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact us page.html">Contact</a></li>
    </ul>
  </nav>

  <div class="page">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    <div id="cart-empty" style="display:none;">
      Your cart is empty. <a href="slider.html">Continue shopping →</a>
    </div>
    <div id="cart-summary" style="display:none;">
      <div class="total">Total: <span id="cart-total">$0.00</span></div>
      <button class="checkout-btn" onclick="phCart.checkout()">Checkout</button>
    </div>
  </div>

  <script src="cart.js"></script>
  <script src="auth.js"></script>
</body>
</html>
