<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Piston Hub</title>
  <link rel="icon" href="images/piston hub white.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif;
           min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: #000; padding: 24px 30px; display: flex; align-items: center;
          font-style: italic; border-bottom: 1px solid #222; }
    .logo img { height: 40px; width: 60px; }
    nav ul { list-style: none; margin-left: auto; }
    nav ul li { display: inline; margin-right: 20px; }
    nav ul li a { color: #fff; text-decoration: none; }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { width: 100%; max-width: 380px; background: #0d0d0d;
                 border: 1px solid #222; border-radius: 10px; padding: 32px; }
    .auth-card h1 { font-size: 26px; margin-bottom: 6px; font-weight: 600; }
    .auth-card .sub { color: #aaa; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; margin: 14px 0 6px; color: #ccc; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333;
            background: #111; color: #fff; font-size: 15px; }
    input:focus { outline: none; border-color: #ff9900; }
    .btn { width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 6px;
           background: #ff9900; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #ffae33; }
    .err { color: #ff6b53; font-size: 14px; margin-top: 14px; min-height: 18px; }
    .alt { text-align: center; margin-top: 18px; font-size: 14px; color: #aaa; }
    .alt a { color: #ff9900; text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <div class="logo"><a href="index.html"><img src="images/piston hub white.png" alt="Piston Hub" /></a></div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="slider.html">Shop</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact us page.html">Contact</a></li>
    </ul>
  </nav>

  <div class="auth-wrap">
    <form class="auth-card" id="signupForm">
      <h1>Create account</h1>
      <p class="sub">Join Piston Hub to start shopping.</p>

      <label for="name">Full name</label>
      <input type="text" id="name" required autocomplete="name" />

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="4" autocomplete="new-password" />

      <button class="btn" type="submit">Create Account</button>
      <div class="err" id="err"></div>
      <p class="alt">Already have an account? <a href="login.html">Sign in</a></p>
    </form>
  </div>

  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      err.textContent = "";
      try {
        phAuth.signup(
          document.getElementById("name").value,
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        window.location.href = "index.html";
      } catch (ex) {
        err.textContent = ex.message;
      }
    });
  </script>
</body>
</html>
